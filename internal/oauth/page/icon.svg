<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>WorldHop</title>
  <!-- Isometric grass block with a two-way sync arrow on top. Light halo + dark
       outline keep it readable on both light and dark taskbars. -->
  <defs>
    <polygon id="top" points="128,20 232,72 128,124 24,72"/>
    <polygon id="left" points="24,72 128,124 128,236 24,184"/>
    <polygon id="right" points="128,124 232,72 232,184 128,236"/>
    <polygon id="cube" points="128,20 232,72 232,184 128,236 24,184 24,72"/>
  </defs>
  <use href="#cube" fill="#ffffff" stroke="#ffffff" stroke-width="22" stroke-linejoin="round"/>
  <use href="#left" fill="#8a5a2c"/>
  <use href="#right" fill="#6a4320"/>
  <use href="#top" fill="#5fc13f"/>
  <!-- dirt speckles on the sides -->
  <g fill="#a87440"><rect x="44" y="136" width="18" height="18"/><rect x="80" y="170" width="18" height="18"/></g>
  <g fill="#855428"><rect x="168" y="150" width="18" height="18"/><rect x="196" y="116" width="14" height="14"/></g>
  <!-- sync arrows, drawn in the top face's own (skewed) coordinate space -->
  <g transform="matrix(1.04 -0.52 1.04 0.52 24 72)" fill="#ffffff" stroke="#14301a" stroke-width="3.5" stroke-linejoin="round">
    <path d="M14 30 H58 V19 L88 36 L58 53 V42 H14 Z"/>
    <path d="M86 58 H42 V47 L12 64 L42 81 V70 H86 Z" transform="translate(0 0)"/>
  </g>
  <use href="#cube" fill="none" stroke="#14301a" stroke-width="9" stroke-linejoin="round"/>
  <path d="M24 72 L128 124 L232 72 M128 124 V236" fill="none" stroke="#14301a" stroke-width="7" stroke-linejoin="round"/>
</svg>
